amcl:
  ros__parameters:
    use_sim_time: true

    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    scan_topic: "scan"
    map_topic: "map"

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    
    #rotational uncertainty
    alpha1: 0.2 
    alpha2: 0.2

    #translational uncertainty
    alpha3: 0.2
    alpha4: 0.2

    #mostly relevant to omnidirectional motion (not used in our case)
    alpha5: 0.2

    min_particles: 500
    max_particles: 2000

    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    update_min_d: 0.20
    update_min_a: 0.20

    laser_model_type: "likelihood_field"
    max_beams: 60
    laser_min_range: -1.0
    laser_max_range: -1.0
    laser_likelihood_max_dist: 2.0

    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.0
    z_max: 0.0
    sigma_hit: 0.2
    lambda_short: 0.1

    do_beamskip: false

    tf_broadcast: true
    transform_tolerance: 1.0

    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false